; LPDDR4X-4266, x32 (two x16 dies in lockstep: one 32-bit channel), JESD209-4B speed bin.
; Timings in tCK = 0.469 ns, from the ns values: tRCD/tRPpb 18 ns, tRAS 42 ns, tRRD 7.5 ns,
; tFAW 30 ns, tWR 18 ns, tWTR 10 ns, tRTP 7.5 ns, tRFCab 280 ns (8 Gb), tREFI 3.904 us.
; RL 36 / WL 18 (set A, DBI off). BL16 -> 64-byte access per transaction.
; Approximation: LPDDR4 x32 is really two independent x16 channels with 32-byte bursts; here they
; are ganged (same bandwidth, 64-byte granularity, one set of 8 banks).
[dram_structure]
protocol = LPDDR4
bankgroups = 1
banks_per_group = 8
rows = 65536
columns = 1024
device_width = 16
BL = 16

[timing]
tCK = 0.469
AL = 0
CL = 36
CWL = 18
tRCD = 39
tRP = 39
tRAS = 90
tRFC = 597
tRFC2 = 597
tRFC4 = 597
tRFCb = 192
tREFI = 8324
tREFIb = 1041
tRPRE = 1
tWPRE = 1
tRRD_S = 16
tRRD_L = 16
tWTR_S = 22
tWTR_L = 22
tFAW = 64
tWR = 39
tWR2 = 39
tRTP = 16
tCCD_S = 8
tCCD_L = 8
tCKE = 16
tCKESR = 32
tXS = 613
tXP = 16
tRTRS = 1
tPPD = 4

[power]
VDD = 1.1
IDD0 = 80
IPP0 = 4.0
IDD2P = 25
IDD2N = 34
IDD3P = 41
IDD3N = 47
IDD4W = 228
IDD4R = 243
IDD5AB = 280
IDD6x = 30

[system]
channel_size = 4096
channels = 1
bus_width = 32
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
trans_queue_size = 32

[other]
epoch_period = 100000000
output_level = 0
